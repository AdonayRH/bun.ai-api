<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom AI Chat</title>
    <meta name="description" content="Chat with AI using Cerebras and Groq">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- PrimsJS for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <!-- Marked for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <!-- Animated background particles -->
    <div class="particles" id="particles"></div>

    <!-- Gradient orbs for ambient lighting -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <div class="app-layout">
        <!-- LEFT PANEL: Chat Interface -->
        <aside class="chat-panel">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-content">
                    <div class="logo">
                        <div class="logo-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                                <path d="M2 17l10 5 10-5" />
                                <path d="M2 12l10 5 10-5" />
                            </svg>
                        </div>
                        <span class="logo-text">AI Chat</span>
                    </div>
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">Online</span>
                    </div>
                </div>
            </header>

            <!-- Chat container -->
            <div class="chat-container">
                <div class="messages-area" id="messagesArea">
                    <!-- Welcome message -->
                    <div class="welcome-message">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path
                                    d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
                                <path
                                    d="M18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z" />
                            </svg>
                        </div>
                        <h2>¡Hola! ¿En qué puedo ayudarte?</h2>
                        <p>Escribe tu mensaje para comenzar una conversación</p>
                    </div>
                </div>

                <!-- Input area -->
                <div class="input-area">
                    <form class="input-form" id="chatForm">
                        <div class="input-wrapper">
                            <!-- Project Select Button -->
                            <button type="button" class="attachment-button" id="selectProjectBtn"
                                title="Select Project Folder">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                                    </path>
                                </svg>
                            </button>
                            <input type="file" id="folderInput" webkitdirectory directory multiple hidden>

                            <textarea id="messageInput" placeholder="Escribe tu mensaje..." rows="1"
                                autofocus></textarea>
                            <button type="submit" class="send-button" id="sendButton">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 2L11 13" />
                                    <path d="M22 2L15 22L11 13L2 9L22 2Z" />
                                </svg>
                            </button>
                        </div>
                    </form>

                    <!-- Context Status Card -->
                    <div id="contextCard" class="context-card hidden">
                        <div class="context-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
                            </svg>
                        </div>
                        <div class="context-info">
                            <span class="context-name" id="contextName">Project Name</span>
                            <span class="context-details" id="contextDetails">Loading...</span>
                        </div>
                        <button class="context-action" id="manageFilesBtn" title="Manage Files">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                            </svg>
                        </button>
                        <button class="context-remove" id="removeContextBtn" title="Remove context">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <p class="disclaimer">Exchange between minds</p>
                </div>
            </div>
        </aside>

        <!-- RIGHT PANEL: Artifacts Workspace -->
        <main class="artifacts-panel" id="artifactsPanel">
            <div class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M14.25 9.75L16.5 12l-2.25 2.25m-4.5 0L7.5 12l2.25-2.25M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" />
                    </svg>
                </div>
                <h3>Workspace vacío</h3>
                <p>El código generado aparecerá aquí automáticamente</p>
            </div>
            <!-- Artifacts will be injected here -->
        </main>
    </div>

    <!-- File Selection Modal -->
    <div id="filesModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Manage Context Files</h3>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="token-stats">
                    <span id="tokenCount">0</span> EST. Tokens
                    <span class="token-limit">/ ~10k Limit</span>
                </div>
                <div class="file-list-actions">
                    <button id="selectAllBtn" class="secondary-btn">Select All</button>
                    <button id="selectNoneBtn" class="secondary-btn">Select None</button>
                </div>
                <div class="file-list" id="fileList">
                    <!-- Files injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="confirmSelectionBtn" class="primary-btn">Confirm Selection</button>
            </div>
        </div>
    </div>

    <!-- PrismJS Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
